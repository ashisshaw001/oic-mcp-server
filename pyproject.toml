[project]
name = "oic-mcp-server"
version = "0.2.0"
description = "Read-only Oracle Integration Cloud monitoring MCP server (Streamable HTTP, multi-environment)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp==2.2.0",
    "fastapi==0.142.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.urls]
Repository = "https://github.com/ashisshaw001/oic-mcp-server"

[project.scripts]
oic-mcp = "oic_mcp.app:main"

[tool.setuptools]
packages = ["oic_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
